  :root { --bg:#FFFFFF; --dot:#9DB4D8; --marker:#5B9BF0; --text:#FFFFFF; }

  body { display:flex; align-items:center; justify-content:center; }
  svg { width:100%; max-height:100vh; height:auto; display:block; }
  .dots circle { fill:var(--dot); fill-opacity:.45; stroke:var(--dot); stroke-opacity:.3; stroke-width:.7; }
  .leaders line { stroke:var(--dot); stroke-width:1; stroke-dasharray:4 3; }
  .labels rect { fill:var(--bg); }
  .labels text { fill:var(--text); font:700 16.7px Calibri, Carlito, "Segoe UI", Arial, sans-serif; dominant-baseline:central; }
  .markers circle { fill:var(--marker); stroke:var(--text); stroke-width:1.7; }
</style>
